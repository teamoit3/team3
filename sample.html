<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>メールセキュリティ教育ツール（PDFハイライト版・Gemini API）</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
    color: #222;
    background: #f5f6f8;
  }
  header {
    padding: 18px 24px;
    background: #fff;
    border-bottom: 1px solid #ddd;
  }
  header h1 { margin: 0 0 6px; font-size: 21px; }
  header p { margin: 0; color: #666; font-size: 13px; }
  .toolbar {
    display: grid;
    grid-template-columns: minmax(280px, 1fr) 220px auto;
    gap: 12px;
    padding: 14px 20px;
    background: #fff;
    border-bottom: 1px solid #ddd;
    position: sticky;
    top: 0;
    z-index: 20;
  }
  .toolbar input, .toolbar select, .toolbar button {
    height: 38px;
    border: 1px solid #bbb;
    border-radius: 6px;
    padding: 0 10px;
    background: #fff;

  .toolbar button {
    cursor: pointer;
    font-weight: bold;
  }
  .toolbar button:disabled { opacity: .5; cursor: not-allowed; }
  .main {
    display: grid;
    grid-template-columns: minmax(500px, 1.25fr) minmax(360px, .75fr);
    gap: 16px;
    padding: 16px;

  }
  .panel {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 10px;
    overflow: hidden;

  .panel-title {
    padding: 11px 14px;
    border-bottom: 1px solid #ddd;
    font-weight: bold;
    background: #fafafa;
  }
  #pdfViewer {
    padding: 20px;
    overflow: auto;
    max-height: calc(100vh - 160px);
  }
  .pdf-page {
    position: relative;
    margin: 0 auto 20px;
    background: #fff;
    box-shadow: 0 2px 10px rgba(0,0,0,.15);
  }
  .pdf-page canvas {
    display: block;
  }
  .highlight-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .highlight {
    position: absolute;
    border-radius: 3px;
    opacity: .48;
    pointer-events: auto;
    cursor: pointer;
    transition: opacity .12s, outline .12s;
  }
  .highlight:hover, .highlight.active {
    opacity: .8;
    outline: 2px solid #555;
  }
  .cat-なりすまし { background: #ff9999; }
  .cat-緊急性煽り { background: #ffc266; }
  .cat-個人情報要求 { background: #ff7777; }
  .cat-不審URL { background: #ffb38a; }
  .cat-その他 { background: #d0b3ff; }
  .empty {
    color: #777;
    padding: 50px 20px;
    text-align: center;
  }
  .status {
    padding: 10px 14px;
    font-size: 13px;
    color: #666;
    background: #fafafa;
    border-top: 1px solid #eee;
  }
  .risk-score {
    margin: 14px;
    padding: 13px 15px;
    border-radius: 8px;
    font-weight: bold;

  .risk-mid { background: #fff1cc; color: #8a5a00; }

    margin: 0 14px 14px;
    padding: 10px 12px;
    background: #f5f7fb;
    border-radius: 7px;
    font-size: 13px;

  .flag-list { padding: 0 14px 14px; }
  .flag-item {
    border: 1px solid #ddd;
    border-left: 5px solid #c55;
    border-radius: 7px;
    padding: 11px 12px;
    margin: 10px 0;
    cursor: pointer;
    background: #fff;
  }
  .flag-item:hover, .flag-item.active {
    background: #fafafa;
    outline: 2px solid #ddd;
  }
  .flag-category {
    font-weight: bold;
    color: #a00000;
    margin-bottom: 5px;
  }
  .matched {
    margin: 7px 0;
    padding: 7px 9px;
    background: #f3f3f3;
    border-radius: 5px;
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    font-size: 12px;
    word-break: break-all;
  }
  .advice { margin-top: 7px; }
  .small {
    font-size: 11px;
    color: #888;
  }
  .legend {
    padding: 10px 14px;
    border-top: 1px solid #eee;
    font-size: 11px;
    color: #666;
  }
  .legend span {
    display: inline-block;

    border-radius: 3px;
    margin-right: 5px;
  }
  @media (max-width: 900px) {
    .toolbar { grid-template-columns: 1fr; }
    .main { grid-template-columns: 1fr; }
    #pdfViewer { max-height: none; }
  }
</style>
</head>
<body>

<header>
  <h1>📧 メールセキュリティ教育ツール（PDFハイライト版・Gemini API）</h1>
  <p>PDFの見た目を維持したまま、AIが検出した危険箇所をPDF上にハイライトします。</p>
</header>

<div class="toolbar">
  <input type="password" id="apiKey" placeholder="Gemini APIキー（デモ用）">
  <select id="literacyLevel">
    <option value="beginner">初心者向け（やさしい説明）</option>
    <option value="advanced">上級者向け（技術的な説明）</option>
  </select>
  <button id="analyzeBtn" disabled>PDFを選択してください</button>
</div>

<div class="main">
  <section class="panel">
    <div class="panel-title">元のPDF</div>
    <div id="pdfViewer">
      <div class="empty">ここにPDFが表示されます</div>
    </div>
    <div id="status" class="status">PDF未選択</div>
    <div class="legend">
      <span class="cat-なりすまし">なりすまし</span>
      <span class="cat-緊急性煽り">緊急性煽り</span>
      <span class="cat-個人情報要求">個人情報要求</span>
      <span class="cat-不審URL">不審URL</span>
    </div>
  </section>

  <section class="panel">
    <div class="panel-title">AI分析結果</div>
    <div id="output">
      <div class="empty">PDFを選択して「AI分析」を押してください</div>
    </div>
  </section>
</div>

<script type="module">
import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.1.200/pdf.min.mjs";

pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.1.200/pdf.worker.min.mjs";

// Gemini APIのモデル名。必要に応じて変更可（例: gemini-2.5-flash など）。
const GEMINI_MODEL = "gemini-3.6-flash";

const els = {
  apiKey: document.getElementById("apiKey"),
  literacy: document.getElementById("literacyLevel"),
  analyzeBtn: document.getElementById("analyzeBtn"),
  viewer: document.getElementById("pdfViewer"),
  status: document.getElementById("status"),
  output: document.getElementById("output")
};

let currentFile = null;
let currentPdf = null;
let documentModel = null;
let currentFlags = [];

const CATEGORY_COLORS = {
  "なりすまし": "cat-なりすまし",
  "緊急性煽り": "cat-緊急性煽り",
  "個人情報要求": "cat-個人情報要求",
  "不審URL": "cat-不審URL"
};

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = String(str ?? "");
  return div.innerHTML;
}

function setStatus(message) {
  els.status.textContent = message;
}

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

/*
 * PDF.jsの各text itemを、画面上の矩形と文字列に変換する。
 * item単位の座標を保持することで、後からAIのmatched_textを
 * PDF上のハイライト位置へ戻せる。
 */
function itemToBox(item, viewport) {
  const tx = pdfjsLib.Util.transform(viewport.transform, item.transform);
  const x = tx[4];
  const y = tx[5];

  const fontHeight = Math.max(
    1,
    Math.hypot(tx[2], tx[3])
  );

  const width = Math.max(
    1,
    Math.abs(item.width * viewport.scale)
  );

  return {
    x,
    y: y - fontHeight,
    width,
    height: fontHeight
  };
}

function normalizeForSearch(s) {
  return String(s ?? "")
    .replace(/\u00a0/g, " ")
    .replace(/[ \t\r\n]+/g, " ")
    .trim();
}

/*
 * PDFページ内の文字情報をモデル化する。
 *
 * text:
 *   AIに渡すための文章
 *
 * chars:
 *   textの各文字が、どのPDF itemに属するか
 *
 * boxes:
 *   各itemのPDF上の座標
 */
async function buildDocumentModel(pdf) {
  const pages = [];
  let globalText = "";
  let globalCharMap = [];

  for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {
    const page = await pdf.getPage(pageNumber);
    const viewport = page.getViewport({ scale: 1.5 });
    const content = await page.getTextContent({
      disableCombineTextItems: false
    });

    const items = [];

    for (const raw of content.items) {
      if (!("str" in raw) || !raw.str) continue;

      const box = itemToBox(raw, viewport);
      items.push({
        str: raw.str,
        box,
        pageNumber
      });
    }

    /*
     * PDF.jsの順序を基本的に維持する。
     * メールPDFではこの方が読み順を壊しにくい。
     */
    let pageText = "";
    let pageCharMap = [];

    for (let i = 0; i < items.length; i++) {
      const item = items[i];

      if (pageText.length > 0) {
        pageText += " ";
        pageCharMap.push(null);
      }

      for (let c = 0; c < item.str.length; c++) {
        pageCharMap.push(i);
      }

      pageText += item.str;
    }

    /*
     * ページ区切りは必ず改行にする。
     */
    if (globalText.length > 0) {
      globalText += "\n";
      globalCharMap.push(null);
    }

    const globalOffset = globalText.length;
    globalText += pageText;
    globalCharMap.push(...pageCharMap);

    pages.push({
      pageNumber,
      viewport,
      items,
      text: pageText,
      globalOffset
    });
  }

  return {
    pdf,
    pages,
    text: globalText,
    charMap: globalCharMap
  };
}

/*
 * 指定した元テキスト範囲に含まれるitemのboxを集める。
 * 同じitemが何文字も含む場合は1つにまとめる。
 */
function boxesForRange(model, start, end) {
  const result = [];
  const seen = new Set();

  for (let i = start; i < end && i < model.charMap.length; i++) {
    const itemIndex = model.charMap[i];
    if (itemIndex == null) continue;

    let pageNumber = 0;
    for (const page of model.pages) {
      const local = i - page.globalOffset;
      if (local >= 0 && local < page.text.length) {
        pageNumber = page.pageNumber;
        break;
      }
    }

    if (!pageNumber) continue;

    const key = pageNumber + ":" + itemIndex;
    if (seen.has(key)) continue;
    seen.add(key);

    const page = model.pages[pageNumber - 1];
    if (page && page.items[itemIndex]) {
      result.push({
        pageNumber,
        ...page.items[itemIndex].box
      });
    }
  }

  return mergeBoxes(result);
}

/*
 * 文字列が複数item・複数行にまたがった場合、
 * 同じ行にある矩形を横方向にまとめる。
 */
function mergeBoxes(boxes) {
  if (!boxes.length) return [];

  const sorted = [...boxes].sort((a, b) => {
    if (a.pageNumber !== b.pageNumber) return a.pageNumber - b.pageNumber;
    if (Math.abs(a.y - b.y) > 3) return a.y - b.y;
    return a.x - b.x;
  });

  const merged = [];

  for (const box of sorted) {
    const last = merged[merged.length - 1];

    if (
      last &&
      last.pageNumber === box.pageNumber &&
      Math.abs(last.y - box.y) <= Math.max(3, last.height * 0.45) &&
      box.x <= last.x + last.width + 8
    ) {
      const right = Math.max(last.x + last.width, box.x + box.width);
      const bottom = Math.max(last.y + last.height, box.y + box.height);
      last.width = right - last.x;
      last.height = bottom - last.y;
    } else {
      merged.push({ ...box });
    }
  }

  return merged;
}

/*
 * PIIをトークンに置換する。
 *
 * 重要:
 * token -> 元の文字 + PDF上の座標
 * を保存する。
 *
 * 同じ電話番号が2回出ても PHONE_1 / PHONE_2 が
 * 別トークンになるので、別座標として管理できる。
 */
function maskPII(model) {
  const source = model.text;

  const patterns = [
    {
      label: "PHONE",
      regex: /(?:\+81[-\s]?)?0\d{1,4}[-\s]\d{1,4}[-\s]\d{3,4}/g
    },
    {
      label: "EMAIL",
      regex: /[A-Za-z0-9.!#$%&'*+/=?^_`{|}~-]+@[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)+/g
    }
  ];

  const replacements = [];
  let counter = 0;

  for (const pattern of patterns) {
    pattern.regex.lastIndex = 0;
    let match;

    while ((match = pattern.regex.exec(source)) !== null) {
      counter++;
      replacements.push({
        start: match.index,
        end: match.index + match[0].length,
        token: `《${pattern.label}_${counter}》`,
        original: match[0],
        category: pattern.label,
        boxes: boxesForRange(model, match.index, match.index + match[0].length)
      });
    }
  }

  replacements.sort((a, b) => a.start - b.start);

  /*
   * 重複する正規表現マッチは除外。
   */
  const nonOverlapping = [];
  let lastEnd = -1;

  for (const r of replacements) {
    if (r.start >= lastEnd) {
      nonOverlapping.push(r);
      lastEnd = r.end;
    }
  }

  let masked = "";
  let cursor = 0;
  const tokenMap = {};

  for (const r of nonOverlapping) {
    masked += source.slice(cursor, r.start);
    masked += r.token;

    tokenMap[r.token] = {
      token: r.token,
      original: r.original,
      boxes: r.boxes,
      start: r.start,
      end: r.end
    };

    cursor = r.end;
  }

  masked += source.slice(cursor);

  return {
    masked,
    tokenMap
  };
}

/*
 * AIが返した普通の文章を、マスキング後テキスト上で検索する。
 *
 * 同じ文章が複数回ある場合に備え、
 * context_before / context_after をAIにも返させる。
 */
function findAllOccurrences(text, needle) {
  const result = [];
  if (!needle) return result;

  let pos = 0;
  while (true) {
    const found = text.indexOf(needle, pos);
    if (found === -1) break;
    result.push({ start: found, end: found + needle.length });
    pos = found + Math.max(1, needle.length);
  }

  return result;
}

function chooseOccurrence(text, flag) {
  const exact = findAllOccurrences(text, flag.matched_text);

  if (!exact.length) return null;
  if (exact.length === 1) return exact[0];

  const before = normalizeForSearch(flag.context_before || "");
  const after = normalizeForSearch(flag.context_after || "");

  let best = null;
  let bestScore = -1;

  for (const occ of exact) {
    const left = normalizeForSearch(
      text.slice(Math.max(0, occ.start - 120), occ.start)
    );
    const right = normalizeForSearch(
      text.slice(occ.end, Math.min(text.length, occ.end + 120))
    );

    let score = 0;

    if (before && left.endsWith(before)) score += 4;
    else if (before && left.includes(before)) score += 2;

    if (after && right.startsWith(after)) score += 4;
    else if (after && right.includes(after)) score += 2;

    if (score > bestScore) {
      bestScore = score;
      best = occ;
    }
  }

  return best || exact[0];
}

function resolveFlag(model, maskedText, tokenMap, flag) {
  const matched = String(flag.matched_text || "").trim();
  if (!matched) return null;

  /*
   * マスキングトークンなら事前保存した座標を使う。
   */
  if (tokenMap[matched]) {
    const entry = tokenMap[matched];

    return {
      ...flag,
      matched_text: entry.original,
      display_matched_text: matched,
      boxes: entry.boxes,
      source: "masked-token"
    };
  }

  /*
   * 普通の文章ならAIが返した文字列を検索し、
   * その範囲のPDF item座標を取得する。
   */
  const occurrence = chooseOccurrence(maskedText, flag);
  if (!occurrence) return null;

  const boxes = boxesForRange(
    model,
    occurrence.start,
    occurrence.end
  );

  return {
    ...flag,
    boxes,
    source: "text-search"
  };
}

async function renderPDF(pdf, model) {
  els.viewer.innerHTML = "";

  for (const pageInfo of model.pages) {
    const page = await pdf.getPage(pageInfo.pageNumber);
    const viewport = page.getViewport({ scale: 1.5 });

    pageInfo.viewport = viewport;

    const pageWrap = document.createElement("div");
    pageWrap.className = "pdf-page";
    pageWrap.dataset.page = pageInfo.pageNumber;

    pageWrap.style.width = `${viewport.width}px`;
    pageWrap.style.height = `${viewport.height}px`;

    const canvas = document.createElement("canvas");
    canvas.width = Math.ceil(viewport.width);
    canvas.height = Math.ceil(viewport.height);
    canvas.width = Math.ceil(viewport.width * devicePixelRatio);
    canvas.height = Math.ceil(viewport.height * devicePixelRatio);
    canvas.style.width = `${viewport.width}px`;
    canvas.style.height = `${viewport.height}px`;

    const ctx = canvas.getContext("2d", { alpha: false });
    const renderViewport = page.getViewport({
      scale: 1.5 * devicePixelRatio
    });

    await page.render({
      canvasContext: ctx,
      viewport: renderViewport
    }).promise;

    const highlightLayer = document.createElement("div");
    highlightLayer.className = "highlight-layer";
    highlightLayer.dataset.page = pageInfo.pageNumber;

    pageWrap.appendChild(canvas);
    pageWrap.appendChild(highlightLayer);
    els.viewer.appendChild(pageWrap);

    pageInfo.pageWrap = pageWrap;
    pageInfo.highlightLayer = highlightLayer;
  }
}

function clearHighlights() {
  for (const page of documentModel?.pages || []) {
    if (page.highlightLayer) {
      page.highlightLayer.innerHTML = "";
    }
  }
}

function addHighlight(flag, flagIndex) {
  const colorClass =
    CATEGORY_COLORS[flag.category] || "cat-その他";

  const elements = [];

  for (const box of flag.boxes || []) {
    const page = documentModel.pages[box.pageNumber - 1];
    if (!page || !page.highlightLayer) continue;

    const el = document.createElement("div");
    el.className = `highlight ${colorClass}`;
    el.dataset.flagIndex = flagIndex;

    el.style.left = `${box.x}px`;
    el.style.top = `${box.y}px`;
    el.style.width = `${Math.max(3, box.width)}px`;
    el.style.height = `${Math.max(5, box.height)}px`;

    el.title = flag.category || "注意点";

    el.addEventListener("click", () => activateFlag(flagIndex));

    page.highlightLayer.appendChild(el);
    elements.push(el);
  }

  flag._elements = elements;
}

function activateFlag(index) {
  currentFlags.forEach((flag, i) => {
    flag._elements?.forEach(el => {
      el.classList.toggle("active", i === index);
    });

    const card = document.querySelector(
      `.flag-item[data-flag-index="${index}"]`
    );
    if (card) card.classList.toggle("active", i === index);
  });

  const flag = currentFlags[index];
  const first = flag?._elements?.[0];

  if (first) {
    first.scrollIntoView({
      behavior: "smooth",
      block: "center",
      inline: "center"
    });
  }

  const card = document.querySelector(
    `.flag-item[data-flag-index="${index}"]`
  );

  if (card) {
    card.scrollIntoView({
      behavior: "smooth",
      block: "nearest"
    });
  }
}

function renderAnalysis(result, flags) {
  clearHighlights();
  currentFlags = flags;

  const score = Math.max(0, Math.min(100, Number(result.risk_score) || 0));

  let riskClass = "risk-low";
  if (score >= 70) riskClass = "risk-high";
  else if (score >= 40) riskClass = "risk-mid";

  for (let i = 0; i < flags.length; i++) {
    addHighlight(flags[i], i);
  }

  let html = `
    <div class="risk-score ${riskClass}">
      危険度スコア：${score} / 100
    </div>
    <div class="summary">
      検出件数：${flags.length}件
      <div class="small">
        PDF上の色付き部分をクリックすると、右側の説明と対応します。
      </div>
    </div>
    <div class="flag-list">
  `;

  if (!flags.length) {
    html += `<div class="empty">特に注意すべき箇所は検出されませんでした。</div>`;
  } else {
    flags.forEach((flag, index) => {
      const reason =
        els.literacy.value === "advanced"
          ? flag.reason_advanced
          : flag.reason_beginner;

      html += `
        <div class="flag-item" data-flag-index="${index}">
          <div class="flag-category">
            ⚠ ${escapeHtml(flag.category || "その他")}
          </div>
          <div class="matched">
            ${escapeHtml(flag.matched_text || "")}
          </div>
          <div>${escapeHtml(reason || "理由の説明がありません。")}</div>
          <div class="advice">
            <strong>対策：</strong>
            ${escapeHtml(flag.advice || "不明")}
          </div>
          <div class="small" style="margin-top:7px;">
            位置特定方法：
            ${flag.source === "masked-token"
              ? "マスキングトークンから座標を復元"
              : "PDF.jsの文字情報から文字列検索"}
          </div>
        </div>
      `;
    });
  }

  html += `</div>`;
  els.output.innerHTML = html;

  document.querySelectorAll(".flag-item").forEach(card => {
    card.addEventListener("click", () => {
      activateFlag(Number(card.dataset.flagIndex));
    });
  });
}

/*
 * Gemini APIを呼び出してメール本文を分析する。
 *
 * Anthropic版との主な違い:
 * - エンドポイントが generativelanguage.googleapis.com
 * - 認証はヘッダーではなくURLクエリの key= で渡す
 * - リクエストボディは { contents: [{ parts: [{ text }] }] } の形式
 * - JSONのみを返させたい場合は generationConfig.responseMimeType が使える
 * - レスポンスは data.candidates[0].content.parts[0].text
 */
async function analyzeMail(maskedText, literacyLevel, apiKey) {
  const prompt = `
あなたはメールセキュリティ教育ツールの分析エンジンです。
以下のメール本文を分析し、フィッシング・詐欺・なりすまし等の危険箇所を検出してください。

重要なルール:
1. matched_text は、入力本文に実際に存在する文字列を完全一致で返す。
2. 《PHONE_数字》や《EMAIL_数字》などのトークンは絶対に変更しない。
3. 普通の文章を検出した場合も、入力本文からそのまま抜粋する。
4. 同じ matched_text が本文に複数回ある可能性がある。その場合は context_before と context_after を使って該当箇所を区別する。
5. context_before / context_after は、matched_textの直前・直後に実際に存在する短い文字列を抜粋する。なければ空文字列。
6. URLそのものを検出する場合、入力本文中のURLをそのまま matched_text にする。マスキングされていないURLを勝手に《URL_1》へ変更しない。
7. 出力はJSONのみ。Markdownコードブロックは禁止。
8. categoryは「なりすまし」「緊急性煽り」「個人情報要求」「不審URL」のいずれか。
9. 危険箇所が複数ある場合は、それぞれ別のflagにする。
10. 根拠が弱いものを無理に危険と判定しない。

JSON形式:
{
  "risk_score": 0から100の整数,
  "flags": [
    {
      "matched_text": "入力本文中の実在する文字列",
      "context_before": "直前の短い文字列",
      "context_after": "直後の短い文字列",
      "category": "なりすまし または 緊急性煽り または 個人情報要求 または 不審URL",
      "reason_beginner": "初心者にも分かる理由を2文程度",
      "reason_advanced": "技術的な観点からの理由を2文程度",
      "advice": "具体的な対策"
    }
  ]
}

ITリテラシーレベル: ${literacyLevel}

メール本文:
${maskedText}
`;

  const endpoint =
    `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${encodeURIComponent(apiKey)}`;

  const response = await fetch(endpoint, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      contents: [
        {
          role: "user",
          parts: [{ text: prompt }]
        }
      ],
      generationConfig: {
        temperature: 0.2,
        // 2000だとreason_beginner/advancedが長いflagが複数あると
        // 出力途中で打ち切られてJSON解析に失敗することがあるため増やす
        maxOutputTokens: 8192,
        // モデルにJSONのみを返させる（Gemini 1.5/2.0系で対応）
        responseMimeType: "application/json"
      }
    })
  });

  if (!response.ok) {
    const body = await response.text();
    throw new Error(`Gemini APIエラー ${response.status}: ${body}`);
  }

  const data = await response.json();

  // セーフティフィルタ等でブロックされた場合の分かりやすいエラー
  const blockReason = data?.promptFeedback?.blockReason;
  if (blockReason) {
    throw new Error(`Geminiにより入力がブロックされました（理由: ${blockReason}）`);
  }

  const candidate = data?.candidates?.[0];
  const finishReason = candidate?.finishReason;

  const raw = candidate?.content?.parts
    ?.map(p => p.text || "")
    ?.join("") || "";

  if (!raw) {
    throw new Error(
      "AIからテキスト形式の応答が返りませんでした。" +
      (finishReason ? `（finishReason: ${finishReason}）` : "")
    );
  }

  const cleaned = raw
    .replace(/^```json\s*/i, "")
    .replace(/^```\s*/i, "")
    .replace(/\s*```$/i, "")
    .trim();

  try {
    return JSON.parse(cleaned);
  } catch (e) {
    /*
     * finishReasonがMAX_TOKENSの場合、出力が途中で打ち切られて
     * JSONが不完全になっている可能性が高いので、その旨を明示する。
     */
    if (finishReason === "MAX_TOKENS") {
      throw new Error(
        "AIの出力が途中で打ち切られたため、JSON解析に失敗しました。" +
        "（生成トークン数の上限に達しました）\n" +
        "メール本文が長い場合はページ数を減らすか、maxOutputTokensを" +
        "さらに増やしてください。\n\n受信した内容（末尾）:\n" +
        cleaned.slice(-500)
      );
    }

    throw new Error(
      "AIのJSON解析に失敗しました。" +
      (finishReason ? `（finishReason: ${finishReason}）\n` : "\n") +
      "AIの返答:\n" + cleaned.slice(0, 1000)
    );
  }
}

async function handleFile(file) {
  currentFile = file;
  els.analyzeBtn.disabled = true;
  els.analyzeBtn.textContent = "PDF読み込み中...";
  els.output.innerHTML = `<div class="empty">PDFを解析しています...</div>`;

  try {
    if (file.type !== "application/pdf") {
      throw new Error("PDFファイルを選択してください。");
    }

    const buffer = await file.arrayBuffer();

    setStatus("PDF.jsでPDFを読み込み中...");
    currentPdf = await pdfjsLib.getDocument({ data: buffer }).promise;

    setStatus(`PDF ${currentPdf.numPages}ページを文字解析中...`);
    documentModel = await buildDocumentModel(currentPdf);

    if (!documentModel.text.trim()) {
      throw new Error(
        "PDFから文字を取得できませんでした。このPDFは画像PDF（スキャンPDF）の可能性があります。"
      );
    }

    setStatus("PDFを画面に表示中...");
    await renderPDF(currentPdf, documentModel);

    const { masked, tokenMap } = maskPII(documentModel);

    documentModel.maskedText = masked;
    documentModel.tokenMap = tokenMap;

    const tokenCount = Object.keys(tokenMap).length;

    setStatus(
      `準備完了：${currentPdf.numPages}ページ / ` +
      `抽出文字数 ${documentModel.text.length} / ` +
      `マスキング ${tokenCount}件`
    );

    els.analyzeBtn.disabled = false;
    els.analyzeBtn.textContent = "AI分析を実行";

  } catch (err) {
    console.error(err);
    setStatus("エラー：" + err.message);
    els.output.innerHTML = `
      <div class="empty">
        <strong>読み込みに失敗しました。</strong><br><br>
        ${escapeHtml(err.message)}
      </div>
    `;
    els.analyzeBtn.disabled = true;
    els.analyzeBtn.textContent = "PDFを選択してください";
  }
}

/*
 * ファイル入力をtoolbarに動的追加。
 * ボタンの左に配置するためinput type=fileを使う。
 */
const fileInput = document.createElement("input");
fileInput.type = "file";
fileInput.accept = "application/pdf";
fileInput.id = "pdfInput";
fileInput.title = "分析するPDF";
fileInput.style.position = "absolute";
fileInput.style.width = "1px";
fileInput.style.height = "1px";
fileInput.style.opacity = "0";
fileInput.style.pointerEvents = "none";

document.body.appendChild(fileInput);

const chooseButton = document.createElement("button");
chooseButton.textContent = "PDFを選択";
chooseButton.addEventListener("click", () => fileInput.click());

els.analyzeBtn.before(chooseButton);

fileInput.addEventListener("change", e => {
  const file = e.target.files?.[0];
  if (file) handleFile(file);
});

els.analyzeBtn.addEventListener("click", async () => {
  if (!currentFile || !documentModel) return;

  const apiKey = els.apiKey.value.trim();

  if (!apiKey) {
    setStatus("Gemini APIキーを入力してください。");
    els.apiKey.focus();
    return;
  }

  try {
    els.analyzeBtn.disabled = true;
    els.analyzeBtn.textContent = "AI分析中...";
    setStatus("個人情報をマスキングした文章をAIへ送信しています...");
    els.output.innerHTML =
      `<div class="empty">AIがメールを分析しています...</div>`;

    await sleep(100);

    const result = await analyzeMail(
      documentModel.maskedText,
      els.literacy.value,
      apiKey
    );

    const rawFlags = Array.isArray(result.flags) ? result.flags : [];

    const resolved = [];

    for (const flag of rawFlags) {
      const resolvedFlag = resolveFlag(
        documentModel,
        documentModel.maskedText,
        documentModel.tokenMap,
        flag
      );

      if (resolvedFlag && resolvedFlag.boxes?.length) {
        resolved.push(resolvedFlag);
      }
    }

    renderAnalysis(result, resolved);

    setStatus(
      `分析完了：AI検出 ${rawFlags.length}件 / ` +
      `PDF上に位置特定できたもの ${resolved.length}件`
    );

  } catch (err) {
    console.error(err);
    setStatus("AI分析エラー：" + err.message);
    els.output.innerHTML = `
      <div class="empty">
        <strong>AI分析に失敗しました。</strong><br><br>
        ${escapeHtml(err.message)}
      </div>
    `;
  } finally {
    els.analyzeBtn.disabled = false;
    els.analyzeBtn.textContent = "AI分析を実行";
  }
});

/*
 * APIキーはlocalStorage等には保存しない。
 */
window.addEventListener("beforeunload", () => {
  els.apiKey.value = "";
});
</script>
